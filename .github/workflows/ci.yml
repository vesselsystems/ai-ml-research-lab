name: quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Validate provenance when a local snapshot is available
        run: python scripts/validate_provenance.py --allow-missing --allow-pending
      - name: Run tests
        run: pytest
      - name: Lint
        run: ruff check .
